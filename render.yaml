# Render Blueprint: Webservice + Postgres-Datenbank (Spielstand bleibt bei Neustarts erhalten)
services:
  - type: web
    name: altstadt-weihnachtsmarkt
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: weihnachtsmarkt-db
          property: connectionString
      - key: ADMIN_USER        # Login der Verwaltung: Wert wird auf Render eingetragen (nicht im öffentlichen Code)
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
databases:
  - name: weihnachtsmarkt-db
    region: frankfurt
    plan: free
